version: 1
stack: autoforge
description: Repository-level MCP catalog for the Autoforge engineering stack.

mcps:
  - id: playwright
    enabled: true
    priority: critical
    category: e2e
    description: Browser automation for auth, UI, redirect, and request tracing.
    used_for:
      - Reproduce real login flows against live or preview environments.
      - Verify redirect handling, callback URLs, and authenticated UI state.
      - Capture failing requests, response codes, and console errors.
      - Confirm that frontend fixes actually work in a browser, not only in code review.

  - id: github
    enabled: true
    priority: critical
    category: delivery
    description: GitHub and GitHub Actions integration for PRs, checks, logs, and releases.
    used_for:
      - Inspect PR state, review status, mergeability, and release notes.
      - Read Actions logs for build, deploy, and image publishing failures.
      - Correlate merged changes with workflow runs on main.
      - Check whether deploy workflows actually fired after merges.

  - id: github-actions
    enabled: true
    priority: critical
    category: delivery
    description: GitHub Actions workflow, job, artifact, cache, permission, and runner diagnostics.
    used_for:
      - Read full workflow/job logs and isolate the first actionable failure.
      - Verify workflow triggers, path filters, permissions, secrets, variables, and runner environment.
      - Trace merge-to-deploy behavior across `main` pushes and PR checks.
      - Diagnose artifact/image handoff failures between build, GHCR, and deploy jobs.

  - id: ghcr-registry
    enabled: true
    priority: critical
    category: delivery
    description: GitHub Container Registry image, tag, digest, package permission, and pull/push diagnostics.
    used_for:
      - Verify GHCR package existence, tag availability, digests, and image ownership.
      - Check deploy token scope, package visibility, and runner pull/push failures.
      - Compare expected project version tags with registry state before deploy.
      - Diagnose third-party image preload and cache behavior for private hosts.

  - id: jira
    enabled: true
    priority: critical
    category: delivery
    description: Jira issue, epic, story, backlog, status, and release tracking integration.
    local_launch: ops/mcp/jira-local.sh
    used_for:
      - Create, read, update, and transition Jira epics, stories, bugs, tasks, and spikes.
      - Run JQL searches for backlog grooming, migration checks, and status synchronization.
      - Link Jira issues with branches, commits, pull requests, releases, and verification notes.
      - Support Jira-first source-of-truth workflows after the Markdown task migration.

  - id: ssh-remote-shell
    enabled: true
    priority: critical
    category: runtime
    description: Remote shell access to public and private OCI hosts.
    used_for:
      - Inspect live compose stacks and runtime environment files.
      - Read container logs and health status directly on the hosts.
      - Verify what versions are really running in OCI.
      - Debug production-only issues that cannot be reproduced locally.

  - id: docker-compose
    enabled: true
    priority: critical
    category: runtime
    description: Container, image, compose, and exec-level runtime inspection.
    used_for:
      - Compare desired image tags with actually running containers.
      - Inspect compose env drift between public and private hosts.
      - Exec into gateway or backend containers for targeted checks.
      - Validate that deploy scripts resulted in the expected runtime state.

  - id: docker-engine
    enabled: true
    priority: critical
    category: runtime
    description: Docker Engine inspection for images, networks, volumes, iptables integration, and one-shot utility containers.
    used_for:
      - Validate image availability, tags, digests, and local image cache state.
      - Inspect Docker networks, volumes, and container runtime metadata exposure.
      - Run short-lived utility containers such as OCI CLI without host package installation.
      - Diagnose Docker daemon, permissions, and `DOCKER-USER` chain behavior.

  - id: firecracker
    enabled: true
    priority: high
    category: runtime-isolation
    description: Firecracker microVM planning and diagnostics for stronger workload isolation.
    used_for:
      - Evaluate whether risky AI/code-execution workloads should run in microVMs instead of plain containers.
      - Review jailer, tap networking, kernel/rootfs, and metadata isolation assumptions.
      - Compare container, microVM, and host-level trust boundaries before runtime changes.
      - Plan future sandboxing for OpenCode or self-improving worker execution.

  - id: http-api
    enabled: true
    priority: critical
    category: runtime
    description: Direct HTTP client for live API, gateway, actuator, Keycloak, and health endpoints.
    used_for:
      - Distinguish 401 vs 404 vs 502 failures in the request chain.
      - Validate `/api/v1/me`, `/api/v1/status`, and `/actuator/health` behavior.
      - Check Keycloak discovery, JWKS, and userinfo endpoints.
      - Confirm whether a bug is frontend-only or backend/runtime-related.

  - id: keycloak-admin
    enabled: true
    priority: critical
    category: auth
    description: Keycloak realm and client administration access.
    used_for:
      - Inspect client settings, redirect URIs, web origins, and flow flags.
      - Check realm config, user accounts, and assigned roles.
      - Detect auth regressions caused by Keycloak-side drift.
      - Validate whether the browser flow and backend expectations still match.

  - id: oci
    enabled: true
    priority: critical
    category: infra
    description: Oracle Cloud Infrastructure inventory and control-plane inspection.
    used_for:
      - Inspect compute instances, VCN layout, and network policy state.
      - Validate Block Volume attachment and host placement.
      - Confirm secret/Vault access assumptions for private runtime.
      - Trace OCI-side causes behind public/private connectivity problems.

  - id: oracle-cloud
    enabled: true
    priority: critical
    category: infra
    description: Oracle Cloud runtime, identity, networking, instance principal, Always Free, and host readiness diagnostics.
    used_for:
      - Validate Dynamic Groups, policies, instance principal behavior, and metadata endpoint assumptions.
      - Check private/public host placement, VCN routing, security lists, NSGs, and jump-host paths.
      - Review Always Free resource constraints, block volumes, and host bootstrap requirements.
      - Correlate OCI control-plane state with live SSH/Docker runtime state.

  - id: cloudflare
    enabled: true
    priority: high
    category: edge
    description: Cloudflare DNS and SSL mode inspection.
    used_for:
      - Verify proxied DNS records for public hostnames.
      - Check whether SSL mode or record drift breaks ingress behavior.
      - Confirm that public deploy scripts changed DNS as expected.
      - Separate Cloudflare edge issues from OCI origin issues.

  - id: vault-secrets
    enabled: true
    priority: high
    category: infra
    description: Secret inventory and metadata checks for runtime dependencies.
    used_for:
      - Verify presence and versioning of OCI Vault-backed secrets.
      - Confirm whether required deploy-time secret references exist.
      - Support rotation planning for runtime credentials.
      - Reduce blind debugging around missing or stale secret references.

  - id: maven-java-deps
    enabled: true
    priority: high
    category: backend
    description: Maven dependency, Java toolchain, Lombok annotation processing, and BOM inspection for Java services.
    used_for:
      - Catch Spring Boot and Spring Cloud version mismatch issues.
      - Inspect runtime dependency trees for production-only breakage.
      - Validate gateway/backend dependency alignment before deploy.
      - Support focused debugging of `NoSuchMethodError`, classpath, Java 21-25, and Lombok annotation processing conflicts.

  - id: spring-framework
    enabled: true
    priority: high
    category: backend
    description: Spring Framework, Spring Boot, Spring Security, Spring Data, and Spring Cloud diagnostics.
    used_for:
      - Validate Spring Boot auto-configuration, profiles, properties, and actuator behavior.
      - Diagnose Spring Security, JWT resource server, CORS, and filter-chain issues.
      - Check Spring Data JPA, datasource, transaction, and repository behavior.
      - Keep Spring Cloud Gateway and backend Spring dependency versions aligned.

  - id: java-platform
    enabled: true
    priority: high
    category: backend
    description: Java language, JVM, toolchain, bytecode, and compatibility diagnostics up to Java 25.
    used_for:
      - Check Java 21 through Java 25 language/runtime compatibility before upgrades.
      - Validate Maven compiler, toolchain, bytecode target, Docker runtime, and CI JDK alignment.
      - Review virtual threads, records, pattern matching, sealed types, and newer JVM feature tradeoffs.
      - Diagnose classfile version, module path, GC, memory, and container JVM behavior.

  - id: lombok
    enabled: true
    priority: medium
    category: backend
    description: Lombok annotation processing, generated code, and maintainability review.
    used_for:
      - Validate Lombok dependency and annotation processor configuration.
      - Review generated constructors, builders, equals/hashCode, logging, and nullability assumptions.
      - Detect Lombok usage that hides domain behavior or persistence side effects.
      - Keep Lombok use minimal, explicit, and compatible with Java/Spring tooling.

  - id: node-workspace
    enabled: true
    priority: medium
    category: frontend
    description: Node workspace and lockfile consistency inspection.
    used_for:
      - Keep root versioning, lockfile state, and workspace consistency aligned.
      - Detect frontend dependency drift across root and app-level packages.
      - Support reproducible installs for web and worker packages.
      - Reduce package-level surprises during CI and release bumps.

  - id: react-web
    enabled: true
    priority: high
    category: frontend
    description: React, Vite, TypeScript, routing, state, and browser runtime diagnostics.
    used_for:
      - Validate React component behavior, hooks, forms, routing, and API integration.
      - Check Vite/TypeScript build and browser runtime differences.
      - Review modern React patterns, including avoiding unnecessary memoization unless the repo pattern requires it.
      - Diagnose frontend state, auth bootstrap, CORS, and gateway request failures.

  - id: react-native
    enabled: true
    priority: medium
    category: mobile
    description: React Native and Expo-style mobile surface planning and diagnostics.
    used_for:
      - Evaluate shared React/domain code boundaries before mobile work.
      - Review navigation, native module, Metro, platform permission, and mobile auth assumptions.
      - Keep React Native implementation separate from web-only Vite/browser assumptions.
      - Plan API contracts and authentication flows that work for mobile clients.

  - id: diagram-architecture
    enabled: true
    priority: medium
    category: docs
    description: Diagram maintenance support for architecture assets.
    used_for:
      - Keep architecture diagrams in sync with runtime topology.
      - Flag when docs mention stale hosts, services, or auth flows.
      - Support SVG/Mermaid/diagram refresh after deploy or topology changes.
      - Reduce architecture drift between code, deploy, and documentation.

  - id: observability
    enabled: false
    priority: backlog
    category: runtime
    description: Future log/metrics/traces integration.
    used_for:
      - Aggregate runtime evidence without shelling into hosts.
      - Support long-term operations once Grafana/Loki/Prometheus/Sentry exist.

  - id: context7
    enabled: true
    priority: high
    category: docs
    description: Up-to-date documentation provider for LLMs and AI code editors.
    used_for:
      - Fetching latest documentation for external libraries or Autoforge-specific APIs.
      - Augmenting agent context with real-time documentation data.

  - id: prompt-library
    enabled: true
    priority: high
    category: ai-governance
    description: Repository-level prompt patterns, guardrails, and prompt quality guidance.
    used_for:
      - Standardize reusable prompt templates for AI agents and user-facing AI workflows.
      - Improve prompt clarity, scope boundaries, acceptance criteria, and expected outputs.
      - Reduce prompt injection risk by separating trusted instructions from untrusted content.
      - Support prompt reviews before adding long-lived agent, workflow, or product prompts.

  - id: sast-scanner
    enabled: true
    priority: critical
    category: security
    description: Static Application Security Testing (SAST) for detecting vulnerabilities in source code.
    used_for:
      - Identifying insecure coding patterns and common vulnerabilities (OWASP Top 10).
      - Running automated scans on new code changes before PR submission.

  - id: secret-scanner
    enabled: true
    priority: critical
    category: security
    description: Scanning repository history for leaked credentials, tokens, and secrets.
    used_for:
      - Detecting accidentally committed API keys or passwords.
      - Ensuring compliance with security best practices regarding secret management.

  - id: dependency-audit
    enabled: true
    priority: high
    category: security
    description: Auditing project dependencies for known vulnerabilities.
    used_for:
      - Checking `npm`, `maven`, and other package managers for vulnerable dependency versions.
      - Validating dependency tree against security advisories.
