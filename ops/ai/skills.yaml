version: 1
stack: autoforge
description: Suggested skill catalog for engineering agents working on Autoforge.

skills:
  - id: auth-debug
    enabled: true
    owners:
      - frontend
      - backend
    uses_mcps:
      - playwright
      - http-api
      - keycloak-admin
      - github
    description: End-to-end authentication debugging for Keycloak, callbacks, tokens, and `/api/v1/me` bootstrap.
    responsibilities:
      - Reproduce login failures in a real browser.
      - Check callback handling, session persistence, and token presence.
      - Separate frontend state bugs from backend JWT rejection.
      - Validate claims, issuer, audience, and protected endpoint behavior.

  - id: gateway-debug
    enabled: true
    owners:
      - edge
      - backend
    uses_mcps:
      - ssh-remote-shell
      - docker-compose
      - http-api
      - maven-java-deps
    description: Public edge and API gateway troubleshooting across Caddy, Spring Cloud Gateway, and upstream routing.
    responsibilities:
      - Diagnose 404, 401, and 502 behavior in the request chain.
      - Validate route config packaging and runtime loading.
      - Confirm header forwarding and backend reachability.
      - Catch dependency mismatches and runtime gateway crashes.

  - id: oci-deploy-debug
    enabled: true
    owners:
      - infra
      - delivery
    uses_mcps:
      - github
      - github-actions
      - ghcr-registry
      - ssh-remote-shell
      - docker-compose
      - oci
      - oracle-cloud
      - cloudflare
      - vault-secrets
    description: OCI runtime and deploy diagnostics across public/private hosts and workflow automation.
    responsibilities:
      - Verify whether the right workflows fired after merges.
      - Compare desired image tags with live runtime tags.
      - Inspect host env drift, compose drift, and deploy path filters.
      - Trace OCI networking, DNS, and secret-related deployment issues.

  - id: github-actions-ghcr-debug
    enabled: true
    owners:
      - delivery
      - infra
    uses_mcps:
      - github-actions
      - ghcr-registry
      - github
      - docker-engine
      - docker-compose
    description: GitHub Actions and GHCR diagnostics for image build, tag, package permission, and deploy handoff failures.
    responsibilities:
      - Inspect workflow runs, failed job logs, path filters, permissions, and runner environment before changing code.
      - Verify GHCR image tags, digests, package visibility, and deploy token scopes.
      - Trace build-to-registry-to-host image handoff and distinguish registry misses from host/runtime issues.
      - Keep versioned image tags aligned with `package.json`, workflows, and deployment docs.

  - id: oracle-cloud-runtime-debug
    enabled: true
    owners:
      - infra
      - delivery
      - security
    uses_mcps:
      - oracle-cloud
      - oci
      - vault-secrets
      - ssh-remote-shell
      - docker-engine
    description: Oracle Cloud runtime diagnostics for compute, networking, instance principal, Vault, and host readiness issues.
    responsibilities:
      - Validate OCI Dynamic Group, policy, Vault, and instance principal assumptions before changing deploy scripts.
      - Check VCN/security list/NSG routing, jump-host access, private host reachability, and metadata endpoint exposure.
      - Correlate OCI control-plane state with host Docker/Compose runtime evidence.
      - Preserve Always Free and reproducibility constraints when proposing infrastructure changes.

  - id: container-runtime-debug
    enabled: true
    owners:
      - infra
      - delivery
      - security
    uses_mcps:
      - docker-engine
      - docker-compose
      - ssh-remote-shell
      - github
      - ghcr-registry
      - vault-secrets
    description: Docker runtime diagnostics for images, compose stacks, one-shot utility containers, and metadata isolation.
    responsibilities:
      - Prefer ephemeral containers for short-lived tools when host package installation is unnecessary.
      - Validate image preload, local cache, tags, networks, volumes, and container permissions.
      - Check Docker metadata endpoint exposure and `DOCKER-USER` isolation rules.
      - Separate Docker daemon, Compose, image, and host permission failures.

  - id: microvm-runtime-isolation
    enabled: true
    owners:
      - infra
      - security
      - ai
    uses_mcps:
      - firecracker
      - docker-engine
      - ssh-remote-shell
      - oci
    description: Firecracker-oriented runtime isolation review for high-risk AI/code-execution workloads.
    responsibilities:
      - Decide when containers are insufficient and microVM isolation should be considered.
      - Review Firecracker jailer, network, rootfs, kernel, and metadata isolation tradeoffs.
      - Keep AI worker and OpenCode sandboxing assumptions explicit before implementation.
      - Document follow-up infrastructure work when microVM isolation is selected.

  - id: backend-auth-runtime
    enabled: true
    owners:
      - backend
      - security
    uses_mcps:
      - http-api
      - spring-framework
      - maven-java-deps
      - java-platform
      - ssh-remote-shell
      - docker-compose
      - keycloak-admin
    description: Spring Security and JWT runtime validation for production-authenticated backend behavior.
    responsibilities:
      - Validate bearer token acceptance in local and production contexts.
      - Investigate issuer, JWKS, static key, and claim mapping issues.
      - Compare local-success / production-failure scenarios with real tokens.
      - Keep backend auth config aligned with Keycloak realm behavior.

  - id: spring-boot-java-runtime
    enabled: true
    owners:
      - backend
      - infra
    uses_mcps:
      - spring-framework
      - maven-java-deps
      - java-platform
      - lombok
      - http-api
      - docker-engine
    description: Spring Boot, Java 21-25, Maven, datasource, actuator, and runtime compatibility diagnostics.
    responsibilities:
      - Validate Spring Boot profiles, configuration properties, auto-configuration, actuator, and datasource setup.
      - Keep Spring Boot, Spring Cloud, Maven BOMs, Java toolchain, and container runtime JDK aligned.
      - Check Java 21 through Java 25 compatibility before changing language level or runtime image.
      - Review Lombok annotation processing and generated code impact in Spring/JPA components.

  - id: react-web-engineering
    enabled: true
    owners:
      - frontend
      - product
    uses_mcps:
      - react-web
      - node-workspace
      - playwright
      - http-api
      - github-actions
    description: React web engineering for Vite/TypeScript UI, auth bootstrap, forms, and browser runtime behavior.
    responsibilities:
      - Validate React component, hook, form, and routing behavior against the existing web patterns.
      - Use browser evidence for UI/auth failures instead of code-only assumptions.
      - Keep Vite, TypeScript, API base URL, CORS, and gateway interactions aligned.
      - Avoid unnecessary React memoization and preserve the current design system unless explicitly changing it.

  - id: react-native-mobile-readiness
    enabled: true
    owners:
      - frontend
      - mobile
      - product
    uses_mcps:
      - react-native
      - react-web
      - node-workspace
      - http-api
      - keycloak-admin
    description: React Native readiness and mobile-client planning for future Autoforge surfaces.
    responsibilities:
      - Separate web-only assumptions from reusable React/domain logic before mobile work.
      - Review mobile auth, deep-link, API, storage, and platform permission requirements.
      - Keep React Native dependency and Metro/native module decisions explicit.
      - Avoid adding mobile scaffolding until a task explicitly requires it.

  - id: lombok-java-hygiene
    enabled: true
    owners:
      - backend
      - developers
    uses_mcps:
      - lombok
      - java-platform
      - maven-java-deps
      - spring-framework
    description: Lombok usage review for Java/Spring maintainability, generated code clarity, and annotation processing reliability.
    responsibilities:
      - Confirm Lombok annotation processor configuration in Maven and CI.
      - Prefer explicit Java code when Lombok hides behavior, persistence semantics, or important invariants.
      - Review `@Data`, builders, equals/hashCode, constructors, and logging annotations before adding them.
      - Keep Lombok compatible with the active Java version and Spring/JPA model behavior.

  - id: e2e-repro
    enabled: true
    owners:
      - qa
      - frontend
    uses_mcps:
      - playwright
      - react-web
      - http-api
      - github
    description: Deterministic reproduction of browser-visible regressions with request-level evidence.
    responsibilities:
      - Turn vague UI failures into reproducible scripts.
      - Capture console errors, request headers, and redirect URLs.
      - Reduce guesswork during auth and UI regressions.
      - Provide a final proof that a fix works in a browser.

  - id: release-versioning
    enabled: true
    owners:
      - delivery
      - docs
    uses_mcps:
      - github
      - github-actions
      - ghcr-registry
      - node-workspace
    description: Version bump, release manifest, and workflow trigger consistency management.
    responsibilities:
      - Keep task IDs, releases manifest, and package versions aligned.
      - Ensure version changes propagate to image tags and deploy workflows.
      - Detect drift between workflow triggers and release behavior.
      - Reduce deploy surprises caused by stale tags or missed workflows.

  - id: git-management
    enabled: true
    owners:
      - delivery
      - developers
    uses_mcps:
      - github
    description: Git branching, commit hygiene, and PR workflow automation.
    responsibilities:
      - Enforce task-ID-based branching and commit naming.
      - Manage branch lifecycle (creation, pushing, cleanup).
      - Automate PR creation, updates, and title/body formatting.
      - Ensure consistency between local branch state and remote PR status.

  - id: jira-management
    enabled: true
    owners:
      - delivery
      - product
      - developers
    uses_mcps:
      - jira
      - github
    description: Jira-first backlog, issue lifecycle, migration, and PR traceability management.
    responsibilities:
      - Create and update Jira epics, stories, bugs, tasks, and spikes.
      - Keep Jira status aligned with branch, PR, review, merge, and verification state.
      - Support Markdown-to-Jira migration with idempotent external-ID based updates.
      - Enforce Jira issue keys in branch names, commit messages, PR titles, and PR bodies.

  - id: security-audit
    enabled: true
    owners:
      - security
      - developers
    uses_mcps:
      - sast-scanner
      - secret-scanner
      - dependency-audit
    description: Comprehensive automated security auditing and vulnerability assessment.
    responsibilities:
      - Run SAST scans on new code changes.
      - Scan for potential secret leaks in commits.
      - Audit project dependencies for known vulnerabilities.
      - Provide security reports for PR reviews.

  - id: prompt-engineering
    enabled: true
    owners:
      - ai
      - product
      - security
      - developers
    uses_mcps:
      - prompt-library
      - context7
      - secret-scanner
    description: Prompt design, prompt quality, and prompt injection defense for Autoforge AI workflows.
    responsibilities:
      - Create clear, bounded prompts with explicit goals, constraints, inputs, and outputs.
      - Separate trusted system/developer instructions from untrusted user or retrieved content.
      - Review long-lived prompts for ambiguity, over-permission, hidden tool access, and secret exposure risk.
      - Maintain reusable prompt patterns for self-improving web, Jira migration, docs sync, and AI operations.

  - id: docs-sync
    enabled: true
    owners:
      - docs
      - architecture
    uses_mcps:
      - diagram-architecture
      - github
      - oci
      - context7
    description: Documentation and diagram synchronization after architecture, auth, or deploy changes.
    responsibilities:
      - Keep README, architecture, deployment, and authentication docs current.
      - Update architecture diagrams when topology or flow changes.
      - Catch stale wording such as “prepared” when something is already live.
      - Preserve traceability from code/runtime changes back to docs and releases.

  - id: clean-code
    enabled: true
    owners:
      - developers
      - backend
      - frontend
    uses_mcps:
      - github
      - maven-java-deps
      - java-platform
      - lombok
      - react-web
      - spring-framework
    description: Code readability, minimalism, naming, and maintainability guidance for Autoforge changes.
    responsibilities:
      - Prefer the smallest correct change and avoid unnecessary abstraction.
      - Keep methods short, names explicit, and data flow easy to follow.
      - Use Lombok only where it removes obvious boilerplate without hiding behavior.
      - Review code for duplicated logic, unclear naming, and accidental complexity before shipping.
