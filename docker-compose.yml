name: autoforge-mvp

services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AUTOFORGE_GITHUB_TOKEN: ${AUTOFORGE_GITHUB_TOKEN:-}
      AUTOFORGE_GITHUB_OWNER: ${AUTOFORGE_GITHUB_OWNER:-}
      AUTOFORGE_GITHUB_REPO: ${AUTOFORGE_GITHUB_REPO:-autoforge}
      AUTOFORGE_GITHUB_API_BASE_URL: ${AUTOFORGE_GITHUB_API_BASE_URL:-https://api.github.com}
      AUTOFORGE_BASE_BRANCH: ${AUTOFORGE_BASE_BRANCH:-main}
      AUTOFORGE_CORS_ALLOWED_ORIGINS: ${AUTOFORGE_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - appnet

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://kc.prodet.org}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-autoforge}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-autoforge-web}
    ports:
      - "${WEB_PORT:-8081}:8080"
    networks:
      - appnet

networks:
  appnet:
    name: autoforge-local
