spring:
  application:
    name: autoforge-backend
  datasource:
    url: jdbc:h2:mem:autoforge;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

autoforge:
  mvp:
    job-processor:
      enabled: false
    github:
      owner: prodet
      repo: autoforge
      api-base-url: https://api.github.com
      token: test-token
