spring:
  application:
    name: autoforge-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keycloak-public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

autoforge:
  security:
    cors:
      allowed-origins: ${AUTOFORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://oci.prodet.org}
