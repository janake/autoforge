spring:
  application:
    name: autoforge-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://kc.prodet.org/realms/autoforge}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

autoforge:
  security:
    cors:
      allowed-origins: ${AUTOFORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://oci.prodet.org}
