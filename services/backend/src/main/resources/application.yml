spring:
  application:
    name: autoforge-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keycloak-public.pem

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

autoforge:
  mvp:
    github:
      token: ${AUTOFORGE_GITHUB_TOKEN:}
      owner: ${AUTOFORGE_GITHUB_OWNER:}
      repo: ${AUTOFORGE_GITHUB_REPO:autoforge}
      base-branch: ${AUTOFORGE_BASE_BRANCH:main}
  security:
    cors:
      allowed-origins: ${AUTOFORGE_CORS_ALLOWED_ORIGINS:https://oci.prodet.org}
