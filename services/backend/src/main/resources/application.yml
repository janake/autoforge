spring:
  application:
    name: autoforge-backend
  servlet:
    multipart:
      max-file-size: ${AUTOFORGE_LEARNING_MAX_FILE_SIZE:10MB}
      max-request-size: ${AUTOFORGE_LEARNING_MAX_REQUEST_SIZE:10MB}
  datasource:
    url: ${AUTOFORGE_DB_URL:}
    username: ${AUTOFORGE_DB_USERNAME:}
    password: ${AUTOFORGE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keycloak-public.pem

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

autoforge:
  mvp:
    job-processor:
      enabled: ${AUTOFORGE_JOB_PROCESSOR_ENABLED:false}
      poll-interval-ms: ${AUTOFORGE_JOB_PROCESSOR_POLL_INTERVAL_MS:5000}
    opencode:
      server-url: ${OPENCODE_SERVER_URL:}
      username: ${OPENCODE_SERVER_USERNAME:opencode}
      password: ${OPENCODE_SERVER_PASSWORD:}
      model: ${OPENCODE_MODEL:autoforge-openrouter/deepseek/deepseek-chat}
    github:
      token: ${AUTOFORGE_GITHUB_TOKEN:}
      owner: ${AUTOFORGE_GITHUB_OWNER:}
      repo: ${AUTOFORGE_GITHUB_REPO:autoforge}
      api-base-url: ${AUTOFORGE_GITHUB_API_BASE_URL:https://api.github.com}
      base-branch: ${AUTOFORGE_BASE_BRANCH:main}
  security:
    cors:
      allowed-origins: ${AUTOFORGE_CORS_ALLOWED_ORIGINS:https://oci.prodet.org}
