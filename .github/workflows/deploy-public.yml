name: Deploy Public Host

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "infra/compose/**"
      - "infra/deploy/public/**"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DEPLOY_PATH: /opt/autoforge/public

jobs:
  deploy-public:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read project version
        run: |
          PROJECT_VERSION=$(node -p 'require("./package.json").version')
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Wait for versioned public images
        env:
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          IMAGE_TAG="${PROJECT_VERSION:?PROJECT_VERSION is required}"
          echo "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u "$GHCR_DEPLOY_USERNAME" --password-stdin
          for image in "ghcr.io/${{ github.repository_owner }}/autoforge/web:$IMAGE_TAG" "ghcr.io/${{ github.repository_owner }}/autoforge/api-gateway:$IMAGE_TAG"; do
            for attempt in $(seq 1 20); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "Versioned image is not available: $image" >&2
                exit 1
              fi
              sleep 15
            done
          done

      - name: Prepare SSH client
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload public stack files
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
        run: |
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" "$TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" infra/compose/docker-compose.public.yml "$TARGET:$DEPLOY_PATH/docker-compose.public.yml"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" infra/compose/Caddyfile "$TARGET:$DEPLOY_PATH/Caddyfile"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" infra/deploy/public/deploy.sh "$TARGET:$DEPLOY_PATH/deploy.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" infra/deploy/public/cloudflare_sync.py "$TARGET:$DEPLOY_PATH/cloudflare_sync.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" "$TARGET" "chmod +x '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH/cloudflare_sync.py'"

      - name: Render public runtime environment
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          GATEWAY_DOMAIN: ${{ secrets.OCI_GATEWAY_DOMAIN }}
          BACKEND_UPSTREAM: ${{ secrets.OCI_BACKEND_UPSTREAM }}
          KEYCLOAK_URL: ${{ secrets.OCI_KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.OCI_KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.OCI_KEYCLOAK_CLIENT_ID }}
        run: |
          IMAGE_TAG="${PROJECT_VERSION:?PROJECT_VERSION is required}"
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          KEYCLOAK_URL="${KEYCLOAK_URL:-https://kc.prodet.org}"
          KEYCLOAK_REALM="${KEYCLOAK_REALM:-autoforge}"
          KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID:-autoforge-web}"
          {
            echo "WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/web"
            echo "WEB_IMAGE_TAG=$IMAGE_TAG"
            echo "API_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/api-gateway"
            echo "API_IMAGE_TAG=$IMAGE_TAG"
            echo "GATEWAY_DOMAIN=$GATEWAY_DOMAIN"
            echo "BACKEND_UPSTREAM=$BACKEND_UPSTREAM"
            echo "API_UPSTREAM=api:8080"
            echo "WEB_UPSTREAM=web:8080"
            echo "GATEWAY_HTTP_PORT=80"
            echo "GATEWAY_HTTPS_PORT=443"
            echo "KEYCLOAK_URL=$KEYCLOAK_URL"
            echo "KEYCLOAK_REALM=$KEYCLOAK_REALM"
            echo "KEYCLOAK_CLIENT_ID=$KEYCLOAK_CLIENT_ID"
          } > /tmp/autoforge-public.env
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" /tmp/autoforge-public.env "$TARGET:$DEPLOY_PATH/.env"

      - name: Upload registry and Cloudflare credentials
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_SSL_MODE: ${{ secrets.CLOUDFLARE_SSL_MODE }}
        run: |
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          {
            echo "GHCR_USERNAME=$GHCR_DEPLOY_USERNAME"
            echo "GHCR_TOKEN=$GHCR_DEPLOY_TOKEN"
            if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ZONE_ID:-}" ]; then
              echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
              echo "CLOUDFLARE_ZONE_ID=$CLOUDFLARE_ZONE_ID"
              echo "CLOUDFLARE_ORIGIN_HOST=$PUBLIC_SSH_HOST"
              if [ -n "${CLOUDFLARE_SSL_MODE:-}" ]; then
                echo "CLOUDFLARE_SSL_MODE=$CLOUDFLARE_SSL_MODE"
              fi
            fi
          } > /tmp/autoforge-public.deploy.env
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" /tmp/autoforge-public.deploy.env "$TARGET:$DEPLOY_PATH/.deploy.env"

      - name: Deploy public stack
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
        run: |
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" "$TARGET" "APP_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/deploy.sh'"
