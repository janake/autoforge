name: Deploy Public Host

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to deploy for the public web and API gateway images
        required: true
        default: main

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/autoforge/public

jobs:
  deploy-public:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH client
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload public stack files
        env:
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
        run: |
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519"
          TARGET="$PUBLIC_USER@$PUBLIC_HOST"
          ssh $SSH_OPTS "$TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp $SSH_OPTS infra/compose/docker-compose.public.yml "$TARGET:$DEPLOY_PATH/docker-compose.public.yml"
          scp $SSH_OPTS infra/compose/Caddyfile "$TARGET:$DEPLOY_PATH/Caddyfile"
          scp $SSH_OPTS infra/deploy/public/deploy.sh "$TARGET:$DEPLOY_PATH/deploy.sh"
          ssh $SSH_OPTS "$TARGET" "chmod +x '$DEPLOY_PATH/deploy.sh'"

      - name: Render public runtime environment
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          GATEWAY_DOMAIN: ${{ secrets.OCI_GATEWAY_DOMAIN }}
          BACKEND_UPSTREAM: ${{ secrets.OCI_BACKEND_UPSTREAM }}
        run: |
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519"
          TARGET="$PUBLIC_USER@$PUBLIC_HOST"
          {
            echo "WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/web"
            echo "WEB_IMAGE_TAG=$IMAGE_TAG"
            echo "API_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/api-gateway"
            echo "API_IMAGE_TAG=$IMAGE_TAG"
            echo "GATEWAY_DOMAIN=$GATEWAY_DOMAIN"
            echo "BACKEND_UPSTREAM=$BACKEND_UPSTREAM"
            echo "API_UPSTREAM=api:8080"
            echo "WEB_UPSTREAM=web:8080"
            echo "GATEWAY_HTTP_PORT=80"
            echo "GATEWAY_HTTPS_PORT=443"
          } > /tmp/autoforge-public.env
          scp $SSH_OPTS /tmp/autoforge-public.env "$TARGET:$DEPLOY_PATH/.env"

      - name: Upload registry credentials
        env:
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519"
          TARGET="$PUBLIC_USER@$PUBLIC_HOST"
          {
            echo "GHCR_USERNAME=$GHCR_DEPLOY_USERNAME"
            echo "GHCR_TOKEN=$GHCR_DEPLOY_TOKEN"
          } > /tmp/autoforge-public.deploy.env
          scp $SSH_OPTS /tmp/autoforge-public.deploy.env "$TARGET:$DEPLOY_PATH/.deploy.env"

      - name: Deploy public stack
        env:
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
        run: |
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519"
          TARGET="$PUBLIC_USER@$PUBLIC_HOST"
          ssh $SSH_OPTS "$TARGET" "APP_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/deploy.sh'"
