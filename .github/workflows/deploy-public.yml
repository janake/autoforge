name: Deploy Public Host

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "infra/compose/**"
      - "infra/deploy/public/**"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/autoforge/public

jobs:
  deploy-public:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH client
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload public stack files
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
        run: |
          SSH_COMMON=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519")
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          ssh "${SSH_COMMON[@]}" "$TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp "${SSH_COMMON[@]}" infra/compose/docker-compose.public.yml "$TARGET:$DEPLOY_PATH/docker-compose.public.yml"
          scp "${SSH_COMMON[@]}" infra/compose/Caddyfile "$TARGET:$DEPLOY_PATH/Caddyfile"
          scp "${SSH_COMMON[@]}" infra/deploy/public/deploy.sh "$TARGET:$DEPLOY_PATH/deploy.sh"
          ssh "${SSH_COMMON[@]}" "$TARGET" "chmod +x '$DEPLOY_PATH/deploy.sh'"

      - name: Render public runtime environment
        env:
          IMAGE_TAG: main
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          GATEWAY_DOMAIN: ${{ secrets.OCI_GATEWAY_DOMAIN }}
          BACKEND_UPSTREAM: ${{ secrets.OCI_BACKEND_UPSTREAM }}
          KEYCLOAK_URL: ${{ secrets.OCI_KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.OCI_KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.OCI_KEYCLOAK_CLIENT_ID }}
        run: |
          SSH_COMMON=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519")
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          KEYCLOAK_URL="${KEYCLOAK_URL:-https://kc.prodet.org}"
          KEYCLOAK_REALM="${KEYCLOAK_REALM:-autoforge}"
          KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID:-autoforge-web}"
          {
            echo "WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/web"
            echo "WEB_IMAGE_TAG=$IMAGE_TAG"
            echo "API_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/api-gateway"
            echo "API_IMAGE_TAG=$IMAGE_TAG"
            echo "GATEWAY_DOMAIN=$GATEWAY_DOMAIN"
            echo "BACKEND_UPSTREAM=$BACKEND_UPSTREAM"
            echo "API_UPSTREAM=api:8080"
            echo "WEB_UPSTREAM=web:8080"
            echo "GATEWAY_HTTP_PORT=80"
            echo "GATEWAY_HTTPS_PORT=443"
            echo "KEYCLOAK_URL=$KEYCLOAK_URL"
            echo "KEYCLOAK_REALM=$KEYCLOAK_REALM"
            echo "KEYCLOAK_CLIENT_ID=$KEYCLOAK_CLIENT_ID"
          } > /tmp/autoforge-public.env
          scp "${SSH_COMMON[@]}" /tmp/autoforge-public.env "$TARGET:$DEPLOY_PATH/.env"

      - name: Upload registry credentials
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          SSH_COMMON=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519")
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          {
            echo "GHCR_USERNAME=$GHCR_DEPLOY_USERNAME"
            echo "GHCR_TOKEN=$GHCR_DEPLOY_TOKEN"
          } > /tmp/autoforge-public.deploy.env
          scp "${SSH_COMMON[@]}" /tmp/autoforge-public.deploy.env "$TARGET:$DEPLOY_PATH/.deploy.env"

      - name: Deploy public stack
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
        run: |
          SSH_COMMON=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519")
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          TARGET="$PUBLIC_USER@$PUBLIC_SSH_HOST"
          ssh "${SSH_COMMON[@]}" "$TARGET" "APP_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/deploy.sh'"
