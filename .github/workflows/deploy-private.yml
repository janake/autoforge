name: Deploy Private Host

on:
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - "services/provider-proxy/**"
      - "infra/compose/**"
      - "infra/deploy/private/**"
      - ".github/workflows/deploy-private.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DEPLOY_PATH: /opt/autoforge/private

jobs:
  deploy-private:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read project version
        run: |
          PROJECT_VERSION=$(node -p 'require("./package.json").version')
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Prepare SSH client
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_SSH_HOST: ${{ secrets.OCI_PRIVATE_SSH_HOST }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
        run: |
          PUBLIC_SSH_HOST="${PUBLIC_SSH_HOST:-${PUBLIC_HOST:-}}"
          PRIVATE_SSH_HOST="${PRIVATE_SSH_HOST:-${PRIVATE_HOST:-}}"
          : "${PUBLIC_SSH_HOST:?OCI_PUBLIC_SSH_HOST or OCI_PUBLIC_HOST is required}"
          : "${PRIVATE_SSH_HOST:?OCI_PRIVATE_SSH_HOST or OCI_PRIVATE_HOST is required}"
          : "${PUBLIC_USER:?OCI_PUBLIC_USER is required}"
          : "${PRIVATE_USER:?OCI_PRIVATE_USER is required}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host autoforge-jump
            HostName $PUBLIC_SSH_HOST
            User $PUBLIC_USER
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 5

          Host autoforge-private
            HostName $PRIVATE_SSH_HOST
            User $PRIVATE_USER
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 5
            ProxyJump autoforge-jump
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload private stack files
        shell: bash
        run: |
          for attempt in 1 2 3; do
            tar -czf - --transform='s|.*/||' \
              infra/compose/docker-compose.private.yml \
              infra/deploy/private/autoforge-arm-capacity-check.service \
              infra/deploy/private/autoforge-arm-capacity-check.timer \
              infra/deploy/private/autoforge-arm-capacity-summary.service \
              infra/deploy/private/autoforge-arm-capacity-summary.timer \
              infra/deploy/private/autoforge-arm-capacity.py \
              infra/deploy/private/provider-proxy-smoke.sh \
              infra/deploy/private/deploy.sh \
              | ssh -F ~/.ssh/config -o ConnectTimeout=120 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 autoforge-private "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH' && chmod +x '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH/provider-proxy-smoke.sh'" \
              && { echo "Upload succeeded on attempt $attempt"; break; }
            echo "Upload attempt $attempt failed" >&2
            [ "$attempt" -lt 3 ] && echo "Retrying in 10s..." >&2 && sleep 10
          done || { echo "Upload failed after 3 attempts" >&2; exit 1; }

      - name: Render private runtime environment
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_SSH_HOST: ${{ secrets.OCI_PRIVATE_SSH_HOST }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
          OPENROUTER_API_KEY_SECRET_OCID: ${{ secrets.OCI_OPENROUTER_API_KEY_SECRET_OCID }}
          OPENROUTER_API_KEY_SECRET_NAME: ${{ vars.OCI_OPENROUTER_API_KEY_SECRET_NAME }}
          AI_PROVIDER_MODEL: ${{ vars.AI_PROVIDER_MODEL }}
          OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
          OPENROUTER_ALLOWED_MODELS: ${{ vars.OPENROUTER_ALLOWED_MODELS }}
          OPENROUTER_MAX_COMPLETION_TOKENS: ${{ vars.OPENROUTER_MAX_COMPLETION_TOKENS }}
          OPENROUTER_MAX_REQUEST_BYTES: ${{ vars.OPENROUTER_MAX_REQUEST_BYTES }}
          AUTOFORGE_DB_URL: ${{ secrets.AUTOFORGE_DB_URL }}
          AUTOFORGE_DB_URL_SECRET_NAME: ${{ vars.AUTOFORGE_DB_URL_SECRET_NAME }}
          AUTOFORGE_DB_WALLET_URL: ${{ secrets.AUTOFORGE_DB_WALLET_URL }}
          AUTOFORGE_DB_WALLET_URL_SECRET_NAME: ${{ vars.AUTOFORGE_DB_WALLET_URL_SECRET_NAME }}
          AUTOFORGE_DB_WALLET_PASSWORD_SECRET_OCID: ${{ secrets.AUTOFORGE_DB_WALLET_PASSWORD_SECRET_OCID }}
          AUTOFORGE_DB_WALLET_PASSWORD_SECRET_NAME: ${{ vars.AUTOFORGE_DB_WALLET_PASSWORD_SECRET_NAME }}
          AUTOFORGE_DB_SERVICE_ALIAS: ${{ secrets.AUTOFORGE_DB_SERVICE_ALIAS }}
          AUTOFORGE_DB_SERVICE_ALIAS_SECRET_NAME: ${{ vars.AUTOFORGE_DB_SERVICE_ALIAS_SECRET_NAME }}
          AUTOFORGE_DB_USERNAME: ${{ secrets.AUTOFORGE_DB_USERNAME }}
          AUTOFORGE_DB_USERNAME_SECRET_NAME: ${{ vars.AUTOFORGE_DB_USERNAME_SECRET_NAME }}
          AUTOFORGE_DB_PASSWORD: ${{ secrets.AUTOFORGE_DB_PASSWORD }}
          AUTOFORGE_DB_PASSWORD_SECRET_OCID: ${{ secrets.AUTOFORGE_DB_PASSWORD_SECRET_OCID }}
          AUTOFORGE_DB_PASSWORD_SECRET_NAME: ${{ vars.AUTOFORGE_DB_PASSWORD_SECRET_NAME }}
          AUTOFORGE_ARM_CAPACITY_SMTP_HOST: ${{ secrets.AUTOFORGE_ARM_CAPACITY_SMTP_HOST }}
          AUTOFORGE_ARM_CAPACITY_SMTP_PORT: ${{ vars.AUTOFORGE_ARM_CAPACITY_SMTP_PORT }}
          AUTOFORGE_ARM_CAPACITY_SMTP_USERNAME: ${{ secrets.AUTOFORGE_ARM_CAPACITY_SMTP_USERNAME }}
          AUTOFORGE_ARM_CAPACITY_SMTP_PASSWORD: ${{ secrets.AUTOFORGE_ARM_CAPACITY_SMTP_PASSWORD }}
          AUTOFORGE_ARM_CAPACITY_SMTP_FROM: ${{ secrets.AUTOFORGE_ARM_CAPACITY_SMTP_FROM }}
          AUTOFORGE_ARM_CAPACITY_EMAIL_TO: ${{ secrets.AUTOFORGE_ARM_CAPACITY_EMAIL_TO }}
          AUTOFORGE_ARM_CAPACITY_SMTP_STARTTLS: ${{ vars.AUTOFORGE_ARM_CAPACITY_SMTP_STARTTLS }}
          KEYCLOAK_URL: ${{ secrets.OCI_KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.OCI_KEYCLOAK_REALM }}
        run: |
          IMAGE_TAG="${IMAGE_TAG:?IMAGE_TAG is required}"
          KEYCLOAK_URL="${KEYCLOAK_URL:-https://kc.prodet.org}"
          KEYCLOAK_REALM="${KEYCLOAK_REALM:-autoforge}"
          OPENROUTER_API_KEY_SECRET_NAME="${OPENROUTER_API_KEY_SECRET_NAME:-openrouter-api-key}"
          AI_PROVIDER_MODEL="${AI_PROVIDER_MODEL:-${OPENROUTER_DEFAULT_MODEL:-google/gemma-4-26b-a4b-it:free}}"
          {
            echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/backend"
            echo "BACKEND_IMAGE_TAG=$IMAGE_TAG"
            echo "BACKEND_HOST_PORT=8080"
            echo "BACKEND_CONTAINER_PORT=8080"
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
            echo "AUTOFORGE_JOB_PROCESSOR_ENABLED=false"
            echo "AUTOFORGE_GITHUB_OWNER=${{ github.repository_owner }}"
            echo "AUTOFORGE_GITHUB_REPO=${{ github.event.repository.name }}"
            echo "AUTOFORGE_BASE_BRANCH=${{ github.event.repository.default_branch }}"
            echo "OPENROUTER_PROXY_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/openrouter-proxy"
            echo "OPENROUTER_PROXY_IMAGE_TAG=$IMAGE_TAG"
            echo "AI_PROVIDER_PROXY_BASE_URL=http://openrouter-proxy:8080/v1"
            echo "AI_PROVIDER_MODEL=$AI_PROVIDER_MODEL"
            if [[ -n "${OPENROUTER_DEFAULT_MODEL:-}" ]]; then
              echo "OPENROUTER_DEFAULT_MODEL=$OPENROUTER_DEFAULT_MODEL"
            else
              echo "OPENROUTER_DEFAULT_MODEL=google/gemma-4-26b-a4b-it:free"
            fi
            if [[ -n "${OPENROUTER_ALLOWED_MODELS:-}" ]]; then
              echo "OPENROUTER_ALLOWED_MODELS=$OPENROUTER_ALLOWED_MODELS"
            else
              echo "OPENROUTER_ALLOWED_MODELS=google/gemma-4-26b-a4b-it:free"
            fi
            echo "OPENROUTER_MAX_COMPLETION_TOKENS=${OPENROUTER_MAX_COMPLETION_TOKENS:-32768}"
            echo "OPENROUTER_MAX_REQUEST_BYTES=${OPENROUTER_MAX_REQUEST_BYTES:-10485760}"
            echo "OPENROUTER_SITE_URL=https://oci.prodet.org"
            echo "OPENROUTER_APP_NAME=Autoforge"
            if [ -n "${OPENROUTER_API_KEY_SECRET_OCID:-}" ]; then
              echo "OPENROUTER_API_KEY_SECRET_OCID=$OPENROUTER_API_KEY_SECRET_OCID"
            fi
            echo "OPENROUTER_API_KEY_SECRET_NAME=$OPENROUTER_API_KEY_SECRET_NAME"
            if [ -n "${AUTOFORGE_DB_URL:-}" ]; then
              echo "AUTOFORGE_DB_URL=$AUTOFORGE_DB_URL"
            fi
            if [ -n "${AUTOFORGE_DB_URL_SECRET_NAME:-}" ]; then
              echo "AUTOFORGE_DB_URL_SECRET_NAME=$AUTOFORGE_DB_URL_SECRET_NAME"
            fi
            if [ -n "${AUTOFORGE_DB_WALLET_URL:-}" ]; then
              echo "AUTOFORGE_DB_WALLET_URL=$AUTOFORGE_DB_WALLET_URL"
            fi
            if [ -n "${AUTOFORGE_DB_WALLET_URL_SECRET_NAME:-}" ]; then
              echo "AUTOFORGE_DB_WALLET_URL_SECRET_NAME=$AUTOFORGE_DB_WALLET_URL_SECRET_NAME"
            fi
            if [ -n "${AUTOFORGE_DB_WALLET_PASSWORD_SECRET_OCID:-}" ]; then
              echo "AUTOFORGE_DB_WALLET_PASSWORD_SECRET_OCID=$AUTOFORGE_DB_WALLET_PASSWORD_SECRET_OCID"
            fi
            if [ -n "${AUTOFORGE_DB_WALLET_PASSWORD_SECRET_NAME:-}" ]; then
              echo "AUTOFORGE_DB_WALLET_PASSWORD_SECRET_NAME=$AUTOFORGE_DB_WALLET_PASSWORD_SECRET_NAME"
            fi
            if [ -n "${AUTOFORGE_DB_SERVICE_ALIAS:-}" ]; then
              echo "AUTOFORGE_DB_SERVICE_ALIAS=$AUTOFORGE_DB_SERVICE_ALIAS"
            fi
            if [ -n "${AUTOFORGE_DB_SERVICE_ALIAS_SECRET_NAME:-}" ]; then
              echo "AUTOFORGE_DB_SERVICE_ALIAS_SECRET_NAME=$AUTOFORGE_DB_SERVICE_ALIAS_SECRET_NAME"
            fi
            if [ -n "${AUTOFORGE_DB_USERNAME:-}" ]; then
              echo "AUTOFORGE_DB_USERNAME=$AUTOFORGE_DB_USERNAME"
            fi
            if [ -n "${AUTOFORGE_DB_USERNAME_SECRET_NAME:-}" ]; then
              echo "AUTOFORGE_DB_USERNAME_SECRET_NAME=$AUTOFORGE_DB_USERNAME_SECRET_NAME"
            fi
            if [ -n "${AUTOFORGE_DB_PASSWORD:-}" ]; then
              echo "AUTOFORGE_DB_PASSWORD=$AUTOFORGE_DB_PASSWORD"
            fi
            if [ -n "${AUTOFORGE_DB_PASSWORD_SECRET_OCID:-}" ]; then
              echo "AUTOFORGE_DB_PASSWORD_SECRET_OCID=$AUTOFORGE_DB_PASSWORD_SECRET_OCID"
            fi
            if [ -n "${AUTOFORGE_DB_PASSWORD_SECRET_NAME:-}" ]; then
              echo "AUTOFORGE_DB_PASSWORD_SECRET_NAME=$AUTOFORGE_DB_PASSWORD_SECRET_NAME"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_SMTP_HOST:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_SMTP_HOST=$AUTOFORGE_ARM_CAPACITY_SMTP_HOST"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_SMTP_PORT:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_SMTP_PORT=$AUTOFORGE_ARM_CAPACITY_SMTP_PORT"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_SMTP_USERNAME:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_SMTP_USERNAME=$AUTOFORGE_ARM_CAPACITY_SMTP_USERNAME"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_SMTP_PASSWORD:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_SMTP_PASSWORD=$AUTOFORGE_ARM_CAPACITY_SMTP_PASSWORD"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_SMTP_FROM:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_SMTP_FROM=$AUTOFORGE_ARM_CAPACITY_SMTP_FROM"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_EMAIL_TO:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_EMAIL_TO=$AUTOFORGE_ARM_CAPACITY_EMAIL_TO"
            fi
            if [ -n "${AUTOFORGE_ARM_CAPACITY_SMTP_STARTTLS:-}" ]; then
              echo "AUTOFORGE_ARM_CAPACITY_SMTP_STARTTLS=$AUTOFORGE_ARM_CAPACITY_SMTP_STARTTLS"
            fi
            echo "KEYCLOAK_ISSUER_URI=$KEYCLOAK_URL/realms/$KEYCLOAK_REALM"
          } > /tmp/autoforge-private.env
          scp -F ~/.ssh/config /tmp/autoforge-private.env autoforge-private:"$DEPLOY_PATH/.env"

      - name: Upload registry credentials
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_SSH_HOST: ${{ secrets.OCI_PRIVATE_SSH_HOST }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          {
            echo "GHCR_USERNAME=$GHCR_DEPLOY_USERNAME"
            echo "GHCR_TOKEN=$GHCR_DEPLOY_TOKEN"
          } > /tmp/autoforge-private.deploy.env
          scp -F ~/.ssh/config /tmp/autoforge-private.deploy.env autoforge-private:"$DEPLOY_PATH/.deploy.env"

      - name: Deploy private stack
        env:
          PUBLIC_SSH_HOST: ${{ secrets.OCI_PUBLIC_SSH_HOST }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_SSH_HOST: ${{ secrets.OCI_PRIVATE_SSH_HOST }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
        run: |
          ssh -F ~/.ssh/config autoforge-private "APP_DIR='$DEPLOY_PATH' bash -lc 'bash \"$DEPLOY_PATH/deploy.sh\"'"
