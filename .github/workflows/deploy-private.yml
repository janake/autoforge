name: Deploy Private Host

on:
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - "infra/compose/**"
      - "infra/deploy/private/**"
      - ".github/workflows/deploy-private.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/autoforge/private

jobs:
  deploy-private:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH client
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host autoforge-jump
            HostName $PUBLIC_HOST
            User $PUBLIC_USER
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host autoforge-private
            HostName $PRIVATE_HOST
            User $PRIVATE_USER
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand ssh -F ~/.ssh/config -W %h:%p autoforge-jump
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload private stack files
        run: |
          ssh -F ~/.ssh/config autoforge-private "mkdir -p '$DEPLOY_PATH'"
          scp -F ~/.ssh/config infra/compose/docker-compose.private.yml autoforge-private:"$DEPLOY_PATH/docker-compose.private.yml"
          scp -F ~/.ssh/config infra/compose/opencode.json autoforge-private:"$DEPLOY_PATH/opencode.json"
          scp -F ~/.ssh/config infra/deploy/private/deploy.sh autoforge-private:"$DEPLOY_PATH/deploy.sh"
          ssh -F ~/.ssh/config autoforge-private "chmod +x '$DEPLOY_PATH/deploy.sh'"

      - name: Render private runtime environment
        env:
          IMAGE_TAG: main
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
          OPENCODE_SERVER_PASSWORD_SECRET_OCID: ${{ secrets.OCI_OPENCODE_SERVER_PASSWORD_SECRET_OCID }}
          OPENAI_API_KEY_SECRET_OCID: ${{ secrets.OCI_OPENAI_API_KEY_SECRET_OCID }}
          KEYCLOAK_URL: ${{ secrets.OCI_KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.OCI_KEYCLOAK_REALM }}
        run: |
          : "${OPENCODE_SERVER_PASSWORD_SECRET_OCID:?OCI_OPENCODE_SERVER_PASSWORD_SECRET_OCID is required}"
          : "${OPENAI_API_KEY_SECRET_OCID:?OCI_OPENAI_API_KEY_SECRET_OCID is required}"
          KEYCLOAK_URL="${KEYCLOAK_URL:-https://kc.prodet.org}"
          KEYCLOAK_REALM="${KEYCLOAK_REALM:-autoforge}"
          {
            echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/autoforge/backend"
            echo "BACKEND_IMAGE_TAG=$IMAGE_TAG"
            echo "BACKEND_HOST_PORT=8080"
            echo "BACKEND_CONTAINER_PORT=8080"
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
            echo "OPENCODE_IMAGE=ghcr.io/anomalyco/opencode"
            echo "OPENCODE_IMAGE_TAG=latest"
            echo "OPENCODE_SERVER_URL=http://opencode:4096"
            echo "OPENCODE_SERVER_USERNAME=opencode"
            echo "OPENCODE_SERVER_PORT=4096"
            echo "OPENCODE_SERVER_PASSWORD_SECRET_OCID=$OPENCODE_SERVER_PASSWORD_SECRET_OCID"
            echo "OPENAI_API_KEY_SECRET_OCID=$OPENAI_API_KEY_SECRET_OCID"
            echo "KEYCLOAK_ISSUER_URI=$KEYCLOAK_URL/realms/$KEYCLOAK_REALM"
          } > /tmp/autoforge-private.env
          scp -F ~/.ssh/config /tmp/autoforge-private.env autoforge-private:"$DEPLOY_PATH/.env"

      - name: Upload registry credentials
        env:
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          {
            echo "GHCR_USERNAME=$GHCR_DEPLOY_USERNAME"
            echo "GHCR_TOKEN=$GHCR_DEPLOY_TOKEN"
          } > /tmp/autoforge-private.deploy.env
          scp -F ~/.ssh/config /tmp/autoforge-private.deploy.env autoforge-private:"$DEPLOY_PATH/.deploy.env"

      - name: Deploy private stack
        env:
          PUBLIC_HOST: ${{ secrets.OCI_PUBLIC_HOST }}
          PUBLIC_USER: ${{ secrets.OCI_PUBLIC_USER }}
          PRIVATE_HOST: ${{ secrets.OCI_PRIVATE_HOST }}
          PRIVATE_USER: ${{ secrets.OCI_PRIVATE_USER }}
        run: |
          ssh -F ~/.ssh/config autoforge-private "APP_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/deploy.sh'"
