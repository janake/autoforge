name: Gateway Build

on:
  pull_request:
    paths:
      - ".github/workflows/gateway-build.yml"
      - "infra/gateway/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gateway-build.yml"
      - "infra/gateway/**"

permissions:
  contents: read

jobs:
  test-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run gateway tests
        run: mvn -B -q -f infra/gateway/pom.xml test
