name: Frontend Build

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-build.yml"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-build.yml"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck:web

      - name: Build frontend
        run: npm run build:web
