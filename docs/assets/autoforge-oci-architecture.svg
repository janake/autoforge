<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Autoforge OCI architecture</title>
  <desc id="desc">Autoforge deployment on Oracle Cloud Infrastructure with public and private compute instances, OCI Vault, GHCR, GitHub Actions, and a 100 GB OCI Block Volume workspace attached to the private instance.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .oci { fill: none; stroke: #c43e2f; stroke-width: 3; stroke-dasharray: 8 6; rx: 10; }
      .net { fill: #f0fdf4; stroke: #3f7d20; stroke-width: 2; rx: 8; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .service { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 6; }
      .storage { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .vault { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #374151; }
      .arrow { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .mgmt { stroke: #111827; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowDark); }
      .route { stroke: #c43e2f; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <text x="560" y="46" class="text title">AUTOFORGE - OCI Architecture</text>

  <rect x="120" y="75" width="270" height="95" class="panel"/>
  <text x="155" y="113" class="text h1">GitHub Actions</text>
  <text x="155" y="142" class="text body">Build and deploy workflows</text>

  <rect x="520" y="75" width="260" height="95" class="panel"/>
  <text x="560" y="113" class="text h1">GHCR</text>
  <text x="560" y="142" class="text body">Container image registry</text>

  <rect x="980" y="75" width="270" height="95" class="vault"/>
  <text x="1025" y="113" class="text h1">OCI Vault</text>
  <text x="1025" y="142" class="text body">Runtime secrets</text>

  <rect x="45" y="225" width="1410" height="600" class="oci"/>
  <text x="75" y="270" class="text h1">OCI Tenancy</text>
  <text x="75" y="300" class="text body">Compartment: prodet-new</text>

  <rect x="220" y="335" width="390" height="375" class="net"/>
  <text x="250" y="375" class="text h1">Public Subnet</text>
  <rect x="255" y="410" width="320" height="235" class="box"/>
  <text x="285" y="445" class="text h2">OCI Compute Instance</text>
  <text x="285" y="472" class="text body">public entry host</text>
  <rect x="285" y="505" width="260" height="38" class="service"/>
  <text x="305" y="530" class="text body">Docker: Caddy</text>
  <rect x="285" y="552" width="260" height="38" class="service"/>
  <text x="305" y="577" class="text body">Docker: React frontend</text>
  <rect x="285" y="599" width="260" height="38" class="service"/>
  <text x="305" y="624" class="text body">Docker: Spring Cloud API Gateway</text>
  <text x="255" y="675" class="text small">Domains: oci.prodet.org, api.oci.prodet.org</text>

  <rect x="890" y="335" width="410" height="375" class="net"/>
  <text x="920" y="375" class="text h1">Private Workload Host</text>
  <rect x="925" y="410" width="330" height="170" class="box"/>
  <text x="955" y="445" class="text h2">OCI Compute Instance</text>
  <text x="955" y="472" class="text body">private application host</text>
  <rect x="955" y="505" width="270" height="38" class="service"/>
  <text x="975" y="530" class="text body">Docker: Spring Boot backend</text>
  <rect x="955" y="552" width="270" height="38" class="service"/>
  <text x="975" y="577" class="text body">Docker: OpenCode REST AI</text>

  <rect x="925" y="615" width="330" height="70" class="storage"/>
  <text x="955" y="645" class="text h2">OCI Block Volume</text>
  <text x="955" y="670" class="text body">100 GB ext4 workspace</text>
  <text x="955" y="694" class="text small">Mounted at /mnt/autoforge-workspace</text>

  <rect x="690" y="410" width="120" height="70" class="service"/>
  <text x="715" y="438" class="text h2">VCN</text>
  <text x="705" y="463" class="text small">Route tables</text>
  <rect x="690" y="505" width="120" height="70" class="service"/>
  <text x="705" y="535" class="text h2">Security</text>
  <text x="710" y="560" class="text small">Lists / NSGs</text>

  <text x="75" y="520" class="text h2">Internet</text>
  <path d="M145 535 H220" class="arrow"/>
  <path d="M575 575 H925" class="arrow"/>
  <path d="M1255 540 H1375" class="arrow"/>
  <text x="1335" y="520" class="text h2">Internet</text>
  <text x="1318" y="570" class="text small">Updates / outbound</text>

  <path d="M390 122 H520" class="mgmt"/>
  <text x="425" y="105" class="text small">Push images</text>
  <path d="M255 170 V335" class="mgmt"/>
  <path d="M650 170 V335 H415" class="mgmt"/>
  <path d="M780 170 V260 H1090 V410" class="mgmt"/>
  <path d="M1115 170 V410" class="mgmt"/>
  <text x="1005" y="250" class="text small">Private instance reads secrets</text>
  <text x="1005" y="270" class="text small">with instance principal</text>

  <path d="M610 355 H890" class="route"/>
  <path d="M610 650 H890" class="route"/>

  <rect x="145" y="765" width="270" height="70" class="service"/>
  <text x="170" y="795" class="text h2">All components in Docker</text>
  <text x="170" y="820" class="text small">Caddy, React, API gateway, backend, OpenCode</text>

  <rect x="455" y="765" width="270" height="70" class="service"/>
  <text x="480" y="795" class="text h2">Backend internal only</text>
  <text x="480" y="820" class="text small">Public API gateway reaches private backend</text>

  <rect x="765" y="765" width="270" height="70" class="service"/>
  <text x="790" y="795" class="text h2">Secrets in OCI Vault</text>
  <text x="790" y="820" class="text small">Read by private host at deploy time</text>

  <rect x="1075" y="765" width="270" height="70" class="storage"/>
  <text x="1100" y="795" class="text h2">Persistent workspace</text>
  <text x="1100" y="820" class="text small">100 GB OCI Block Volume on private host</text>
</svg>
