server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: backend_api_route
          uri: http://${BACKEND_UPSTREAM}
          predicates:
            - Path=${GATEWAY_CONTEXT:-/api}/**
        - id: backend_actuator_route
          uri: http://${BACKEND_UPSTREAM}
          predicates:
            - Path=/actuator/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
