services:
  api:
    image: autoforge-api-gateway:local
    environment:
      BACKEND_UPSTREAM: backend:8080
      GATEWAY_CONTEXT: /api
    expose:
      - "8080"
    networks:
      - public
      - private
  gateway:
    image: caddy:2.10-alpine
    depends_on:
      - api
    environment:
      GATEWAY_DOMAIN: :80
      API_UPSTREAM: api:8080
      WEB_UPSTREAM: api:8080
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - public
  backend:
    image: autoforge-backend:local
    restart: unless-stopped
    # DO NOT publish backend port to host — keep it internal only
    expose:
      - "8080"
    networks:
      - private
networks:
  public:
  private:
