name: autoforge-private

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${BACKEND_IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: "${BACKEND_MEMORY_LIMIT:-384M}"
    environment:
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      AUTOFORGE_JOB_PROCESSOR_ENABLED: ${AUTOFORGE_JOB_PROCESSOR_ENABLED:-false}
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-http://opencode:4096}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-disabled-until-vault-secrets-are-configured}
      AUTOFORGE_DB_URL: ${AUTOFORGE_DB_URL:?AUTOFORGE_DB_URL is required}
      AUTOFORGE_DB_USERNAME: ${AUTOFORGE_DB_USERNAME:-ADMIN}
      AUTOFORGE_DB_PASSWORD: ${AUTOFORGE_DB_PASSWORD:?AUTOFORGE_DB_PASSWORD is required}
      AUTOFORGE_GITHUB_OWNER: ${AUTOFORGE_GITHUB_OWNER:?AUTOFORGE_GITHUB_OWNER is required}
      AUTOFORGE_GITHUB_REPO: ${AUTOFORGE_GITHUB_REPO:?AUTOFORGE_GITHUB_REPO is required}
      AUTOFORGE_BASE_BRANCH: ${AUTOFORGE_BASE_BRANCH:-main}
      TNS_ADMIN: ${TNS_ADMIN:-/opt/oracle/wallet}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"
    volumes:
      - ./wallet:/opt/oracle/wallet:ro
    networks:
      - private

  opencode:
    image: ${OPENCODE_IMAGE:?OPENCODE_IMAGE is required}:${OPENCODE_IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: "${OPENCODE_MEMORY_LIMIT:-256M}"
    profiles:
      - opencode
    depends_on:
      - openrouter-proxy
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "${OPENCODE_SERVER_PORT:-4096}"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-disabled-until-vault-secrets-are-configured}
      OPENCODE_CONFIG: /etc/opencode/opencode.json
      OPENCODE_MODEL: ${OPENCODE_MODEL:-autoforge-openrouter/qwen/qwen3.6-plus}
    expose:
      - "${OPENCODE_SERVER_PORT:-4096}"
    volumes:
      - ./opencode.json:/etc/opencode/opencode.json:ro
    networks:
      - private

  openrouter-proxy:
    image: ${OPENROUTER_PROXY_IMAGE:?OPENROUTER_PROXY_IMAGE is required}:${OPENROUTER_PROXY_IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: "${OPENROUTER_PROXY_MEMORY_LIMIT:-128M}"
    profiles:
      - opencode
    environment:
      PROVIDER_PROXY_PORT: ${PROVIDER_PROXY_PORT:-8080}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-qwen/qwen3.6-plus}
      OPENROUTER_ALLOWED_MODELS: ${OPENROUTER_ALLOWED_MODELS:-qwen/qwen3.6-plus}
      OPENROUTER_MAX_COMPLETION_TOKENS: ${OPENROUTER_MAX_COMPLETION_TOKENS:-65536}
      OPENROUTER_MAX_REQUEST_BYTES: ${OPENROUTER_MAX_REQUEST_BYTES:-10485760}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Autoforge}
    expose:
      - "${PROVIDER_PROXY_PORT:-8080}"
    networks:
      - private

networks:
  private:
    name: autoforge-private
