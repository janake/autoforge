name: autoforge-private

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${BACKEND_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-http://opencode:4096}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"
    networks:
      - private

  opencode:
    image: ${OPENCODE_IMAGE:?OPENCODE_IMAGE is required}:${OPENCODE_IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles:
      - opencode
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "${OPENCODE_SERVER_PORT:-4096}"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENCODE_CONFIG: /etc/opencode/opencode.json
    expose:
      - "${OPENCODE_SERVER_PORT:-4096}"
    volumes:
      - ./opencode.json:/etc/opencode/opencode.json:ro
    networks:
      - private

networks:
  private:
    name: autoforge-private
