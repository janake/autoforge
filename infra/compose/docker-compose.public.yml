name: autoforge-public

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}:${WEB_IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - public

  # API gateway (Spring Cloud Gateway) sits behind Caddy and proxies API requests
  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${API_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      # Backend upstream that the gateway should forward to (private backend address)
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM}
      # Optional: base context for the gateway (e.g. /api)
      GATEWAY_CONTEXT: ${GATEWAY_CONTEXT:-/api}
    expose:
      - "8080"
    networks:
      - public

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      GATEWAY_DOMAIN: oci.prodet.org
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM}
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:8080}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

networks:
  public:
    name: autoforge-public

volumes:
  caddy_data:
  caddy_config:
